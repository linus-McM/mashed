# lefthook.yml — git hooks for mashed (Go + Svelte Wails app)
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    go-vet:
      glob: "*.go"
      run: go vet ./...
      fail_text: "go vet found issues"

    go-build:
      glob: "*.go"
      run: go build ./...
      fail_text: "go build failed"

    go-test-changed:
      glob: "*.go"
      run: |
        packages=$(git diff --cached --name-only -- '*.go' | xargs -I{} dirname {} | sort -u | grep -v 'internal/terminal' | sed 's|^|./|' | paste -sd' ' -)
        if [ -n "$packages" ]; then
          go test -short -count=1 $packages
        fi
      fail_text: "go tests failed for changed packages"

    frontend-build:
      glob: "frontend/**/*.{svelte,ts,js,css}"
      root: "frontend/"
      run: npx vite build --mode development 2>&1 | tail -5
      fail_text: "frontend build failed"

    # Ratcheted svelte-check gate. During the 1520→0 migration the absolute
    # count is allowed to sit at or below the committed baseline
    # (docs/plans/svelte-check-baseline.md); any commit that raises it is
    # rejected. Flips to strict zero-error in the svelte-check-07 story.
    # If this fails, fix types — do NOT add // @ts-ignore / // @ts-nocheck / any.
    frontend-svelte-check:
      glob: "frontend/**/*.{svelte,ts,js}"
      run: just sveltecheck-ratchet
      fail_text: "svelte-check count rose above baseline. Fix types — do NOT add @ts-ignore / @ts-nocheck / any. Run `just sveltecheck-by-file` to locate errors."

    # desloppify:
    #   Temporarily disabled during the breadcrumbs sprint: the queue carries
    #   ~20 pre-existing items unrelated to the sprint scope, which blocks
    #   every commit. Restore this block after running `desloppify next`
    #   through the backlog (triage target: strict >= 85).
    # desloppify:
    #   glob: "*.{go,svelte,ts,js}"
    #   run: |
    #     REPO_ROOT="$(git rev-parse --show-toplevel)"
    #     DESLOPPIFY="$REPO_ROOT/.venv-desloppify/bin/desloppify"
    #     if [ -x "$DESLOPPIFY" ]; then
    #       "$DESLOPPIFY" scan --skip-slow
    #     fi
    #   fail_text: "desloppify scan found issues"

pre-push:
  parallel: true
  commands:
    go-test-all:
      run: go test -short -count=1 ./internal/...
      fail_text: "go tests failed"

    go-coverage:
      run: bash scripts/check-coverage.sh
      fail_text: "coverage below threshold"

    frontend-test:
      root: "frontend/"
      run: npm test
      fail_text: "frontend tests failed (includes svelte-check zero-error gate)"
