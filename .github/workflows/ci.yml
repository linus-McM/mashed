name: ci

# Go and frontend gates for every push and PR to main and dev (spec R24).
# svelte-check.yml stays separate so its required-check name is unchanged.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      # Ubuntu 24.04 ships webkit2gtk-4.1; Wails v2 selects it with this tag.
      GOFLAGS: -tags=webkit2_41
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: '1.25'

      - name: Install system deps (Wails cgo headers, tmux)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev tmux

      - name: Frontend placeholder is tracked (fresh clone builds without Node)
        run: test -f frontend/dist/.gitkeep

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Terminal fan-out and late-client scrollback, repeated (R20)
        run: go test -count=50 -run 'AC2|LateClient' ./internal/terminal/

      - name: No generated artefacts tracked (R26)
        run: "! git ls-files | grep -E '^(docs/repomixer|\\.playwright-(mcp|cli)|desloppify-workspace|frontend/coverage|\\.vite|frontend/\\.claude)/|^todo\\.md$'"

      - name: No personal home paths tracked (R26)
        run: "! git grep -l -F \"/Users/linus\" -- . ':!docs/plans' ':!sdlc' ':!repo_hygiene_test.go' ':!.github/workflows/ci.yml'"

      - name: No signing identity or personal email tracked (R27)
        run: "! git grep -l -E '5X8A9U965U|linus\\.a\\.mcm' -- . ':!sdlc' ':!repo_hygiene_test.go' ':!.github/workflows/ci.yml'"

      - name: Permission tests as root (R23)
        run: sudo -E env "PATH=$PATH" go test ./internal/bmad/ -run 'ErrorOnReadOnlyDir|StatErrorNotNotExist|WriteFailure'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Token lint
        run: npm run lint:tokens

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Entry chunk under 500 kB (R31)
        run: node ../scripts/check-entry-chunk.mjs

      - name: Build leaves the tree clean
        run: test -z "$(git status --porcelain)"
